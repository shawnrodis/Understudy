name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build the Rust engine
        run: cargo build --release --manifest-path engine/Cargo.toml

      - name: Scaffold the Flutter Windows runner
        # The repo intentionally carries no hand-written windows/runner:
        # a generated runner always matches the installed Flutter version.
        run: |
          flutter create --platforms=windows --org com.shawnrodis --project-name understudy ${{ runner.temp }}\scaffold
          Copy-Item -Recurse ${{ runner.temp }}\scaffold\windows app\windows
          Copy-Item assets\icon.ico app\windows\runner\resources\app_icon.ico

      - name: Build the Flutter app
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Stage installer contents
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\staging | Out-Null
          Copy-Item -Recurse app\build\windows\x64\runner\Release\* build\staging\
          Copy-Item engine\target\release\understudy-engine.exe build\staging\
          Copy-Item assets\icon.ico build\staging\

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build the installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ([string]::IsNullOrEmpty($version) -or $version -eq "workflow_dispatch") { $version = "0.1.0" }
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$version installer\understudy.nsi
          Get-ChildItem *.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Understudy_Setup
          path: Understudy_Setup_*.exe

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Understudy_Setup_*.exe
          generate_release_notes: true
