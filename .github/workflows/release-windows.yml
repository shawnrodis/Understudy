name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build the Rust engine
        run: cargo build --release --manifest-path engine/Cargo.toml

      - name: Scaffold the Flutter Windows runner
        # The repo intentionally carries no hand-written windows/runner:
        # a generated runner always matches the installed Flutter version.
        run: |
          flutter create --platforms=windows --org com.shawnrodis --project-name understudy ${{ runner.temp }}\scaffold
          Copy-Item -Recurse ${{ runner.temp }}\scaffold\windows app\windows
          Copy-Item assets\icon.ico app\windows\runner\resources\app_icon.ico

      - name: Build the Flutter app
        working-directory: app
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release

      - name: Stage installer contents
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\staging | Out-Null
          # Fail loudly on a missing/empty source instead of staging nothing:
          # a previous run staged an empty dir and NSIS failed downstream.
          if (-not (Test-Path app\build\windows\x64\runner\Release\understudy.exe)) { throw "Flutter build output missing: app\build\windows\x64\runner\Release\understudy.exe" }
          if (-not (Test-Path engine\target\release\understudy-engine.exe)) { throw "Engine binary missing: engine\target\release\understudy-engine.exe" }
          Copy-Item -Recurse app\build\windows\x64\runner\Release\* build\staging\
          Copy-Item engine\target\release\understudy-engine.exe build\staging\
          Copy-Item assets\icon.ico build\staging\
          $staged = Get-ChildItem -Recurse build\staging
          if ($staged.Count -eq 0) { throw "Staging is empty after copy" }
          if (-not (Test-Path build\staging\understudy.exe)) { throw "Staged understudy.exe missing" }
          if (-not (Test-Path build\staging\understudy-engine.exe)) { throw "Staged understudy-engine.exe missing" }
          Write-Host "Staged contents:"; $staged | ForEach-Object { Write-Host "  $($_.FullName)" }

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build the installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ([string]::IsNullOrEmpty($version) -or $version -eq "workflow_dispatch") { $version = "0.1.0" }
          # /NOCD is the fix for the previous failure: by default makensis
          # changes its working directory to the .nsi file's folder
          # (installer\), so the script's repo-root-relative
          # build\staging path resolved to installer\build\staging and
          # NSIS reported "no files found". /NOCD keeps the workspace root.
          & "C:\Program Files (x86)\NSIS\makensis.exe" /NOCD /DVERSION=$version installer\understudy.nsi
          Get-ChildItem *.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Understudy_Setup
          path: Understudy_Setup_*.exe

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Understudy_Setup_*.exe
          generate_release_notes: true
